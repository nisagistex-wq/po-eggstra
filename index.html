<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Order EGGSTRA</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; max-width: 480px; width: 100%; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #d97706; margin-bottom: 5px; font-size: 1.6em; }
        p.subtitle { text-align: center; font-size: 0.88em; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95em; }
        input:focus, select:focus { outline: none; border-color: #d97706; }
        .item-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .item-title { font-weight: bold; font-size: 0.9em; color: #1e293b; }
        .item-price { font-size: 0.8em; color: #d97706; font-weight: bold; }
        .summary-box { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.88em; }
        .summary-row.total { font-size: 1.1em; font-weight: bold; color: #047857; border-top: 1px solid #a7f3d0; padding-top: 8px; margin-top: 8px; margin-bottom: 0; }
        button.btn-submit { width: 100%; background-color: #16a34a; color: white; border: none; padding: 12px; font-size: 1em; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button.btn-submit:hover { background-color: #15803d; }
        button.btn-submit:disabled { background-color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥚 Pre-Order EGGSTRA</h2>
    <p class="subtitle">Sistem PO: Isi Form → Transfer → Masuk List Kirim</p>

    <form id="poForm" onsubmit="kirimPesanan(event)">
        <div class="form-group">
            <label for="nama">Nama Pemesan:</label>
            <input type="text" id="nama" required placeholder="Contoh: Budi">
        </div>

        <div class="form-group">
            <label for="whatsapp">Nomor WhatsApp:</label>
            <input type="tel" id="whatsapp" required placeholder="Contoh: 08123456789">
        </div>

        <div class="item-box">
            <div class="item-header">
                <span class="item-title">🥚 Telur Ayam Biasa</span>
                <span class="item-price" id="textHargaBiasa"></span>
            </div>
            <label for="kgBiasa" style="font-size: 0.8em; color: #666;">Jumlah (Kg):</label>
            <input type="number" id="kgBiasa" min="0" step="0.5" value="1" oninput="hitungTotal()">
        </div>

        <div class="item-box">
            <div class="item-header">
                <span class="item-title">🍳 Telur Ayam Omega</span>
                <span class="item-price" id="textHargaOmega"></span>
            </div>
            <label for="kgOmega" style="font-size: 0.8em; color: #666;">Jumlah (Kg):</label>
            <input type="number" id="kgOmega" min="0" step="0.5" value="0" oninput="hitungTotal()">
        </div>

        <div class="form-group">
            <label for="pembayaran">Pilih Metode Pembayaran:</label>
            <select id="pembayaran" required>
                <option value="BCA">Transfer Bank BCA</option>
                <option value="CIMB">Transfer Bank CIMB Niaga</option>
                <option value="CASH">Cash / Tunai saat Ambil</option>
            </select>
        </div>

        <div class="summary-box">
            <div class="summary-row" id="rowBiasa">
                <span>Telur Biasa:</span>
                <span id="detailBiasa">0 Kg</span>
            </div>
            <div class="summary-row" id="rowOmega">
                <span>Telur Omega:</span>
                <span id="detailOmega">0 Kg</span>
            </div>
            <div class="summary-row total">
                <span>Total Bayar:</span>
                <span id="labelTotal">Rp 0</span>
            </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">Kirim Pesanan via WhatsApp 🚀</button>
    </form>
</div>

<script>
    // ============================================================
    // ⚙️ SESUAIKAN DATA KAMU DI SINI
    // ============================================================
    const NOMOR_WA_PENJUAL = "6282118011169"; // Sesuaikan No WA Kamu

    // REKENING BANK KAMU
    const REK_BCA = "1234567890 a.n. Nisa";
    const REK_CIMB = "9876543210 a.n. Nisa";

    const HARGA_BIASA = 23000;              // Sesuaikan Harga Biasa
    const HARGA_OMEGA = 28000;              // Sesuaikan Harga Omega
    
    // Web App URL dari Google Apps Script kamu
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTFAdUNV7obSDr1GQL7wluWLYswq5yzaLPr-yQCUPwGoGyQlQA5_9hkH8-G6n1jsRo/exec";
    // ============================================================

    function formatRupiah(angka) {
        return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    document.getElementById('textHargaBiasa').innerText = formatRupiah(HARGA_BIASA) + ' /kg';
    document.getElementById('textHargaOmega').innerText = formatRupiah(HARGA_OMEGA) + ' /kg';

    function hitungTotal() {
        const kgBiasa = parseFloat(document.getElementById('kgBiasa').value) || 0;
        const kgOmega = parseFloat(document.getElementById('kgOmega').value) || 0;

        const subtotalBiasa = HARGA_BIASA * kgBiasa;
        const subtotalOmega = HARGA_OMEGA * kgOmega;
        const grandTotal = subtotalBiasa + subtotalOmega;

        document.getElementById('detailBiasa').innerText = `${kgBiasa} Kg (${formatRupiah(subtotalBiasa)})`;
        document.getElementById('detailOmega').innerText = `${kgOmega} Kg (${formatRupiah(subtotalOmega)})`;
        document.getElementById('labelTotal').innerText = formatRupiah(grandTotal);
    }

    function kirimPesanan(event) {
        event.preventDefault();

        const btn = document.getElementById('btnSubmit');
        
        // Kunci tombol biar nggak dipencet berulang kali oleh pembeli
        btn.disabled = true;
        btn.innerText = "Pesanan Terkirim! ✅";

        const nama = document.getElementById('nama').value;
        const wa = document.getElementById('whatsapp').value;
        const pembayaran = document.getElementById('pembayaran').value;
        const kgBiasa = parseFloat(document.getElementById('kgBiasa').value) || 0;
        const kgOmega = parseFloat(document.getElementById('kgOmega').value) || 0;

        if (kgBiasa === 0 && kgOmega === 0) {
            alert('Silakan isi jumlah pesanan minimal 0.5 Kg untuk salah satu jenis telur.');
            btn.disabled = false;
            btn.innerText = "Kirim Pesanan via WhatsApp 🚀";
            return;
        }

        const subtotalBiasa = HARGA_BIASA * kgBiasa;
        const subtotalOmega = HARGA_OMEGA * kgOmega;
        const grandTotal = subtotalBiasa + subtotalOmega;

        // 1. KIRIM KE GOOGLE SHEETS DENGAN 'navigator.sendBeacon' (Latar Belakang & Pasti Masuk 1x)
        const payload = JSON.stringify({
            nama: nama,
            wa: wa,
            kgBiasa: kgBiasa,
            kgOmega: kgOmega,
            grandTotal: grandTotal,
            pembayaran: pembayaran
        });

        if (navigator.sendBeacon) {
            navigator.sendBeacon(GOOGLE_SCRIPT_URL, payload);
        } else {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: payload
            });
        }

        // 2. BUKAKAN WHATSAPP SECARA LANGSUNG
        let rincianPesanan = '';
        if (kgBiasa > 0) {
            rincianPesanan += `• Telur Biasa: ${kgBiasa} Kg (@${formatRupiah(HARGA_BIASA)}) = ${formatRupiah(subtotalBiasa)}%0A`;
        }
        if (kgOmega > 0) {
            rincianPesanan += `• Telur Omega: ${kgOmega} Kg (@${formatRupiah(HARGA_OMEGA)}) = ${formatRupiah(subtotalOmega)}%0A`;
        }

        let infoBayar = '';
        if (pembayaran === 'BCA') {
            infoBayar = `*Metode Pembayaran:* Transfer BCA%0A💳 No. Rekening: *${REK_BCA}*%0A%0ASaya akan segera kirim bukti transfer ke sini ya kak!`;
        } else if (pembayaran === 'CIMB') {
            infoBayar = `*Metode Pembayaran:* Transfer CIMB Niaga%0A💳 No. Rekening: *${REK_CIMB}*%0A%0ASaya akan segera kirim bukti transfer ke sini ya kak!`;
        } else {
            infoBayar = `*Metode Pembayaran:* CASH / Tunai%0A💵 Pembayaran dilakukan saat pengambilan telur.`;
        }

        const pesan = `Halo EGGSTRA, saya mau ikut PO Telur %0A%0A` +
                      `*Data Pemesan:*%0A` +
                      `• Nama: ${nama}%0A` +
                      `• No WA: ${wa}%0A%0A` +
                      `*Rincian Pesanan:*%0A` +
                      `${rincianPesanan}%0A` +
                      `*Total Bayar:* *${formatRupiah(grandTotal)}*%0A%0A` +
                      `${infoBayar}`;

        // Langsung redirect halaman/buka tab WA tanpa keblokir pop-up
        window.location.href = `https://wa.me/${NOMOR_WA_PENJUAL}?text=${pesan}`;

        // Buka kembali tombol setelah 4 detik kalau pembeli balik lagi ke tab web
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = "Kirim Pesanan via WhatsApp 🚀";
        }, 4000);
    }

    hitungTotal();
</script>

</body>
</html>
